<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="../../css/font/stylesheet.css">
        <link rel="stylesheet" href="../../css/geral.css">

        <script src="../../js/generico.js" defer></script>
        <script src="../../js/usuario.js" defer></script>
        <script src="../../js/pegarNomeUser_dupe.js" defer></script>

    </head>

    <body>
        <div class="header">
            <span style="font-size: 10px; margin-left: -300px; margin-right: 200px;" id="nome-usuario">visitante</span>
            <button class="botao" onclick="window.location.href='../../home'">HOME</button>
            <button class="botao" onclick="window.location.href='../../viagem'">VIAGEM</button>
            <button class="botao" onclick="window.location.href='../../contato'">CONTATO</button>
            <button class="botao usuario-man" onclick="window.location.href='../login'">LOG-IN</button>
            <button class="botao usuario-man" onclick="window.location.href=''">CADASTRO</button>
        </div>

        <div class="centraliza">
            <div class="header meio">
                <p>Realize o seu Cadastro</p>
                <input class="botao cheio" type="text" id="nome" placeholder="Digite seu Nome">
                <br>
                <input class="botao cheio" type="text" id="CPF" placeholder="Digite seu CPF">
                <br>
                <input class="botao cheio" type="email" id="email" placeholder="Digite seu E-mail">
                <br>
                <input class="botao cheio" type="text" id="numerocelular" placeholder="Digite seu Número de Celular">
                <br>
                <input class="botao cheio" type="password" id="senha" placeholder="Digite sua Senha">
                <br>
                <button class="botao cheio" onclick="EnviarInformacaoUsuario(CADASTRO)">CADASTRAR-SE</button>
            </div>
        </div>

        <div class="header final">
            <span> Site feito para um trabalho de programação WEB para PUCPR</span>
        </div>

    </body>




</html>
